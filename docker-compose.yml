services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bank-backend-container
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: bank-frontend-container
    ports:
      - "5173:80"
    restart: unless-stopped